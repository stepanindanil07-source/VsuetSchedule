# Production profile (SPRING_PROFILES_ACTIVE=prod). Nothing secret is stored here: everything comes from the environment,
# and a missing DB_URL / DB_USER / DB_PASSWORD stops the start with a clear message instead of using a default password.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Import every source right after start (a fresh database has no schedule until the first import).
vsuet.import.run-on-startup=true

# The reverse proxy terminates HTTPS and tells us the original scheme and client.
server.forward-headers-strategy=framework

# API documentation is off in production unless asked for (SWAGGER_ENABLED=true).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
