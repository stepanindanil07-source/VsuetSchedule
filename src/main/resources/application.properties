spring.application.name=vsuet-schedule

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/vsuet_schedule}
spring.datasource.username=${DB_USER:vsuet}
spring.datasource.password=${DB_PASSWORD:vsuet}

# Schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Smaller responses for mobile clients; a clean stop lets a running import finish.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Health checks: only /actuator/health[/...] is reachable, and without details.
#   /actuator/health/liveness   the process is alive (container health check)
#   /actuator/health/readiness  it can serve requests (database reachable)
#   /actuator/health/imports    the schedule is still being updated (for an external uptime monitor)
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.imports.include=importFreshness
