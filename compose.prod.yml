# Production stack: PostgreSQL + the application + a reverse proxy that terminates HTTPS + a daily database backup.
#   cp .env.example .env     (then fill it in)
#   docker compose -f compose.prod.yml up -d --build
# Only the proxy publishes ports (80, 443). The database and the application are reachable only inside this stack.
name: vsuet-schedule

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: vsuet_schedule
      POSTGRES_USER: vsuet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsuet -d vsuet_schedule"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: vsuet-schedule:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/vsuet_schedule
      DB_USER: vsuet
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      VSUET_ADMIN_TOKEN: ${VSUET_ADMIN_TOKEN:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      TZ: Europe/Moscow
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (use http://localhost to try it on one machine)}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: vsuet_schedule
      PGUSER: vsuet
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./ops:/ops:ro
      - ${BACKUP_PATH:-./backups}:/backups
    entrypoint: ["/bin/bash", "/ops/backup-loop.sh"]
    healthcheck:
      # unhealthy when the newest backup is older than two intervals (or there is none after the first interval)
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'vsuet-*.dump' -mmin -$$((2 * ${BACKUP_INTERVAL_HOURS:-24} * 60)) | grep -q ."]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 5m

volumes:
  pgdata:
  caddy_data:
  caddy_config:
