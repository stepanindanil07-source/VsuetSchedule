name: CI

# Every push and pull request: the full test suite (the integration tests start PostgreSQL through Testcontainers, which
# needs Docker; GitHub's ubuntu runners have it) and a check that the production image and compose file still build.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify

  core-ts:
    # TypeScript-ядро автономного приложения: разбор реальных файлов, сверка с Java, набор данных, SQLite (нужен Node с node:sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core-ts/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Production compose file is valid
        run: docker compose -f compose.prod.yml config --quiet
        env:
          DOMAIN: localhost
          DB_PASSWORD: ci-only
      - name: Production image builds
        run: docker build -t vsuet-schedule:ci .
